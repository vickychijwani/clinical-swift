name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Trust the container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Install test dependencies
        run: apt-get update && apt-get install -y libsqlite3-dev openssl
      - name: Test App Store Connect signing
        run: swift scripts/test_app_store_connect.swift
      - name: Resolve Linux package dependencies
        run: swift package resolve
      - name: Check shared package versions
        run: swift scripts/check_package_versions.swift
      - name: Check architecture
        run: sh scripts/check_architecture.sh
      - name: Test architecture checker
        run: sh scripts/test_architecture.sh
      - name: Test package
        run: >-
          swift test --disable-automatic-resolution
          --explicit-target-dependency-import-check error

  architecture:
    name: Architecture
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Test App Store Connect signing
        run: swift scripts/test_app_store_connect.swift
      - name: Check architecture
        run: sh scripts/check_architecture.sh
      - name: Test architecture checker
        run: sh scripts/test_architecture.sh

  ios-build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Apply Xcode CI setup
        run: sh ci_scripts/ci_post_clone.sh
      - name: Build app, widget, and unit test bundle
        run: >-
          xcodebuild -project clinical-swift.xcodeproj
          -scheme clinical-swift-UnitTests
          -destination 'generic/platform=iOS Simulator'
          -disableAutomaticPackageResolution
          CODE_SIGNING_ALLOWED=NO build-for-testing
