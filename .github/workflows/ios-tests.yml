name: iOS tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-tests:
    name: ${{ matrix.name }}
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            name: App unit tests
            scheme: clinical-swift-UnitTests
          - suite: backup
            name: Local backup tests
            scheme: clinical-swift-Backups
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Cache Xcode package downloads
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.1-${{ hashFiles('Package.swift', 'clinical-swift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.1-
      - name: Apply Xcode CI setup
        run: sh ci_scripts/ci_post_clone.sh
      - name: Boot test simulator
        # Let first-boot setup finish before XCTest loads Accessibility.
        run: |
          simulator_id=$(xcrun simctl create 'Clinical CI' \
            com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
            com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          echo "TEST_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b
      - name: Run simulator tests
        # Ad hoc signing preserves Keychain and App Group entitlements without a certificate.
        env:
          TEST_SCHEME: ${{ matrix.scheme }}
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          test_options=()
          if [[ "$TEST_SUITE" == backup ]]; then
            test_options+=(-skip-testing:clinical-swiftBackupTests/BackupDriveTests)
          fi
          xcodebuild -project clinical-swift.xcodeproj \
            -scheme "$TEST_SCHEME" \
            -clonedSourcePackagesDirPath "$GITHUB_WORKSPACE/build/SourcePackages" \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -destination-timeout 120 \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            "${test_options[@]}" test
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.suite }}
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ui-runner:
    name: Select UI runner
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      labels: ${{ steps.select.outputs.labels }}
      local: ${{ steps.select.outputs.local }}
    steps:
      - id: select
        uses: actions/github-script@v7
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        with:
          github-token: ${{ secrets.RUNNER_STATUS_TOKEN || github.token }}
          script: |
            core.setOutput('labels', JSON.stringify(['xcode-27']));
            core.setOutput('local', 'false');
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const trusted = pr.head.repo?.full_name === `${owner}/${context.repo.repo}`
              && pr.user.login === owner && context.actor === owner;
            if (!trusted || !process.env.RUNNER_STATUS_TOKEN) {
              core.info('Using GitHub macOS: local routing is unavailable for this run.');
              return;
            }
            try {
              const { data } = await github.rest.actions.listSelfHostedRunnersForRepo({
                ...context.repo,
                per_page: 100,
                request: { timeout: 10000 },
              });
              const labels = ['self-hosted', 'macOS', 'ARM64', 'clinical-ios'];
              const available = data.runners.some(runner =>
                runner.name === 'clinical-m5' && runner.status === 'online' && !runner.busy
                && labels.every(label => runner.labels.some(item => item.name === label))
              );
              if (available) {
                core.setOutput('labels', JSON.stringify(labels));
                core.setOutput('local', 'true');
                core.info('Using clinical-m5: the runner is online and idle.');
              } else {
                core.info('Using GitHub macOS: clinical-m5 is offline or busy.');
              }
            } catch {
              core.warning('Runner status check failed; using GitHub macOS.');
            }

  ui-tests:
    name: UI tests
    needs: ui-runner
    runs-on: ${{ fromJSON(needs.ui-runner.outputs.labels) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        if: needs.ui-runner.outputs.local != 'true'
        with:
          xcode-version: '27.1'
      - name: Cache Xcode package downloads
        if: needs.ui-runner.outputs.local != 'true'
        uses: actions/cache@v4
        with:
          path: build/SourcePackages
          key: spm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.1-${{ hashFiles('Package.swift', 'clinical-swift.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            spm-v1-${{ runner.os }}-${{ runner.arch }}-xcode-27.1-
      - name: Prepare persistent build paths
        if: needs.ui-runner.outputs.local == 'true'
        # Keep build state outside checkout because checkout removes untracked files.
        run: |
          cache_root="$HOME/ci/clinical-swift/cache/$(xcodebuild -version | shasum -a 256 | cut -c 1-16)"
          mkdir -p "$cache_root/DerivedData" "$cache_root/SourcePackages"
          echo "CI_CACHE_ROOT=$cache_root" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Prepare hosted build paths
        if: needs.ui-runner.outputs.local != 'true'
        run: echo "CI_CACHE_ROOT=$GITHUB_WORKSPACE/build" >> "$GITHUB_ENV"
      - name: Apply Xcode CI setup
        run: sh ci_scripts/ci_post_clone.sh
      - name: Boot test simulator
        # Let first-boot setup finish before XCTest loads Accessibility.
        env:
          USE_LOCAL_RUNNER: ${{ needs.ui-runner.outputs.local }}
        run: |
          if [[ "$USE_LOCAL_RUNNER" == true ]]; then
            echo 'TEST_DESTINATION=platform=iOS Simulator,name=CI Simulator 1,OS=26.5' >> "$GITHUB_ENV"
            xcrun simctl bootstatus 'CI Simulator 1' -b
          else
            simulator_id=$(xcrun simctl create 'Clinical CI' \
              com.apple.CoreSimulator.SimDeviceType.iPhone-17 \
              com.apple.CoreSimulator.SimRuntime.iOS-27-0)
            echo "TEST_DESTINATION=platform=iOS Simulator,id=$simulator_id" >> "$GITHUB_ENV"
            xcrun simctl bootstatus "$simulator_id" -b
          fi
      - name: Run UI tests
        # Ad hoc signing preserves Keychain and App Group entitlements without a certificate.
        run: |
          xcodebuild -project clinical-swift.xcodeproj \
            -scheme clinical-swift-UITests \
            -derivedDataPath "$CI_CACHE_ROOT/DerivedData" \
            -clonedSourcePackagesDirPath "$CI_CACHE_ROOT/SourcePackages" \
            -destination "$TEST_DESTINATION" \
            -destination-timeout 120 \
            -disableAutomaticPackageResolution \
            -parallel-testing-enabled NO \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES test
      - name: Upload failed test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-ui
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
