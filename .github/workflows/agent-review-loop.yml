name: Agent review loop

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      action:
        description: Action to run
        required: true
        default: review
        type: choice
        options:
          - review
          - address
      reviewer:
        description: Reviewer model override (for review action)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - sol
          - neon
          - hydrogen
          - opus
          - all
      author:
        description: Author model override
        required: false
        default: auto
        type: choice
        options:
          - auto
          - sol
          - neon
          - hydrogen
          - opus
      dry_run:
        description: Print commands and plan without running agents or posting to GitHub
        required: false
        default: true
        type: boolean

concurrency:
  group: agent-review-loop-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

env:
  CANONICAL_REPO_PATH: /Users/vicky/code/clinical-swift
  AGENT_MONITOR_DIR: /Users/vicky/.clinical-agent-monitor

jobs:
  plan:
    name: Plan review loop
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.user.login == github.repository_owner ||
        github.event.comment.user.login == 'clinical-pr-shepherd[bot]') &&
       (startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/address')))
    runs-on: clinical-agents
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_branch: ${{ steps.resolve.outputs.pr_branch }}
      pr_head_sha: ${{ steps.resolve.outputs.pr_head_sha }}
      run_review: ${{ steps.resolve.outputs.run_review }}
      run_address: ${{ steps.resolve.outputs.run_address }}
      reviewer_override: ${{ steps.resolve.outputs.reviewer_override }}
      review_all: ${{ steps.resolve.outputs.review_all }}
      author_override: ${{ steps.resolve.outputs.author_override }}
      reviewers_json: ${{ steps.resolve.outputs.reviewers_json }}
      author_json: ${{ steps.resolve.outputs.author_json }}
      author_harness: ${{ steps.resolve.outputs.author_harness }}
      needs_codex_token: ${{ steps.resolve.outputs.needs_codex_token }}
      needs_agy_token: ${{ steps.resolve.outputs.needs_agy_token }}
      worktree_path: ${{ steps.resolve.outputs.worktree_path }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      review_check_runs_json: ${{ steps.create-checks.outputs.review_check_runs_json }}
      address_check_run_id: ${{ steps.create-checks.outputs.address_check_run_id }}
    steps:
      - name: Add Homebrew tools to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Resolve trigger, PR metadata, and worktree models
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_ACTION: ${{ inputs.action }}
          DISPATCH_REVIEWER: ${{ inputs.reviewer }}
          DISPATCH_AUTHOR: ${{ inputs.author }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          write_multiline_output() {
            local key="$1" value="$2"
            local delim
            delim="EOF_$(openssl rand -hex 16)"
            {
              echo "$key<<$delim"
              printf '%s\n' "$value"
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            # Ignore normal prose that happens to start with /reviewing or /addressing.
            first_token=$(printf '%s' "$COMMENT_BODY" | awk 'NR==1 { print $1 }')
            if [[ "$first_token" != "/review" && "$first_token" != "/address" ]]; then
              echo "Ignoring non-command comment."
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              echo "run_address=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! trigger_json=$(swift scripts/agent_review_loop.swift parse-trigger \
            --event "$EVENT_NAME" \
            --body "$COMMENT_BODY" \
            --action "$DISPATCH_ACTION" \
            --reviewer "$DISPATCH_REVIEWER" \
            --author "$DISPATCH_AUTHOR" \
            --pr-number "$DISPATCH_PR_NUMBER" \
            --dry-run "$DISPATCH_DRY_RUN" 2>&1); then
            echo "Trigger parse failed: $trigger_json" >&2
            if [[ "$EVENT_NAME" == "issue_comment" && "$DISPATCH_DRY_RUN" != "true" ]]; then
              gh pr comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Agent review loop stopped: $trigger_json"
            fi
            exit 1
          fi

          action=$(jq -r '.action' <<< "$trigger_json")
          reviewer_override=$(jq -r '(.reviewerOverride // []) | join(",")' <<< "$trigger_json")
          review_all=$(jq -r '.reviewAll' <<< "$trigger_json")
          author_override=$(jq -r '.authorOverride // ""' <<< "$trigger_json")
          dry_run=$(jq -r '.dryRun' <<< "$trigger_json")
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            pr_number="$ISSUE_NUMBER"
          else
            pr_number=$(jq -r '.prNumber' <<< "$trigger_json")
          fi

          pr_json=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --json number,state,headRefName,headRefOid,url)
          pr_state=$(jq -r '.state' <<< "$pr_json")
          pr_branch=$(jq -r '.headRefName' <<< "$pr_json")
          pr_head_sha=$(jq -r '.headRefOid' <<< "$pr_json")

          if [[ "$pr_state" != "OPEN" ]]; then
            reason="PR #$pr_number is $pr_state (expected OPEN)."
            echo "$reason" >&2
            if [[ "$dry_run" != "true" ]]; then
              gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" \
                --body "Agent review loop stopped: $reason"
            fi
            exit 1
          fi

          discover_args=(
            discover
            --repo "$CANONICAL_REPO_PATH"
            --branch "$pr_branch"
            --head-sha "$pr_head_sha"
            --action "$action"
            --require-clean
          )
          if [[ -n "$reviewer_override" ]]; then
            discover_args+=(--reviewers "$reviewer_override")
          fi
          if [[ "$review_all" == "true" ]]; then
            discover_args+=(--review-all)
          fi
          if [[ -n "$author_override" ]]; then
            discover_args+=(--author "$author_override")
          fi

          set +e
          discovery_json=$(swift scripts/agent_review_loop.swift "${discover_args[@]}")
          discover_status=$?
          set -e

          jq -r '.notes[]?' <<< "$discovery_json" | while IFS= read -r note; do
            echo "Note: $note"
          done

          reviewers_json=$(jq -c '.reviewers // []' <<< "$discovery_json")
          author_json=$(jq -c '.author // {}' <<< "$discovery_json")
          author_harness=$(jq -r '.author.harness // ""' <<< "$discovery_json")
          needs_codex_token=$(jq -r '([.author] + (.reviewers // [])) | any(. != null and .harness == "codex")' <<< "$discovery_json")
          needs_agy_token=$(jq -r '([.author] + (.reviewers // [])) | any(. != null and .harness == "antigravity")' <<< "$discovery_json")

          if [[ $discover_status -ne 0 ]]; then
            reason=$(jq -r '.error // "Worktree discovery failed."' <<< "$discovery_json")
            {
              echo "discover_failed=true"
              echo "action=$action"
              echo "pr_number=$pr_number"
              echo "pr_branch=$pr_branch"
              echo "pr_head_sha=$pr_head_sha"
              echo "run_review=false"
              echo "run_address=false"
              echo "reviewers_json=$reviewers_json"
              echo "author_json=$author_json"
              echo "needs_codex_token=$needs_codex_token"
              echo "needs_agy_token=$needs_agy_token"
              echo "dry_run=$dry_run"
              echo "trigger_event=$EVENT_NAME"
              echo "comment_id=$COMMENT_ID"
            } >> "$GITHUB_OUTPUT"
            write_multiline_output "discover_error" "$reason"
            exit 0
          fi

          worktree_path=$(jq -r '.worktreePath // ""' <<< "$discovery_json")
          {
            echo "discover_failed=false"
            echo "action=$action"
            echo "pr_number=$pr_number"
            echo "pr_branch=$pr_branch"
            echo "pr_head_sha=$pr_head_sha"
            echo "run_review=$([[ "$action" == "review" ]] && echo true || echo false)"
            echo "run_address=true"
            echo "reviewer_override=$reviewer_override"
            echo "review_all=$review_all"
            echo "author_override=$author_override"
            echo "reviewers_json=$reviewers_json"
            echo "author_json=$author_json"
            echo "author_harness=$author_harness"
            echo "needs_codex_token=$needs_codex_token"
            echo "needs_agy_token=$needs_agy_token"
            echo "worktree_path=$worktree_path"
            echo "dry_run=$dry_run"
            echo "trigger_event=$EVENT_NAME"
            echo "comment_id=$COMMENT_ID"
          } >> "$GITHUB_OUTPUT"

          reviewer_ids=$(jq -r 'map(.id) | join(",")' <<< "$reviewers_json")
          author_id=$(jq -r '.id // "none"' <<< "$author_json")
          echo "Planned PR #$pr_number ($action): reviewers=${reviewer_ids:-none}, author=$author_id, worktree=$worktree_path, dry_run=$dry_run"

      - name: Create Codex App token
        id: codex-token
        if: (steps.resolve.outputs.run_address == 'true' || steps.resolve.outputs.discover_failed == 'true') && steps.resolve.outputs.dry_run != 'true' && steps.resolve.outputs.needs_codex_token == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_CODEX_APP_ID || secrets.CLINICAL_CODEX_APP_ID }}
          private-key: ${{ secrets.CLINICAL_CODEX_PRIVATE_KEY }}

      - name: Create Antigravity App token
        id: agy-token
        if: (steps.resolve.outputs.run_address == 'true' || steps.resolve.outputs.discover_failed == 'true') && steps.resolve.outputs.dry_run != 'true' && steps.resolve.outputs.needs_agy_token == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_ANTIGRAVITY_APP_ID || secrets.CLINICAL_ANTIGRAVITY_APP_ID }}
          private-key: ${{ secrets.CLINICAL_ANTIGRAVITY_PRIVATE_KEY }}

      - name: Create queued checks and monitor records
        id: create-checks
        if: steps.resolve.outputs.run_address == 'true' || steps.resolve.outputs.discover_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TOKEN: ${{ steps.codex-token.outputs.token }}
          AGY_TOKEN: ${{ steps.agy-token.outputs.token }}
          DISCOVER_FAILED: ${{ steps.resolve.outputs.discover_failed }}
          DISCOVER_ERROR: ${{ steps.resolve.outputs.discover_error }}
          ACTION: ${{ steps.resolve.outputs.action }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_BRANCH: ${{ steps.resolve.outputs.pr_branch }}
          PR_HEAD_SHA: ${{ steps.resolve.outputs.pr_head_sha }}
          REVIEWERS_JSON: ${{ steps.resolve.outputs.reviewers_json }}
          AUTHOR_JSON: ${{ steps.resolve.outputs.author_json }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          TRIGGER_EVENT: ${{ steps.resolve.outputs.trigger_event }}
          COMMENT_ID: ${{ steps.resolve.outputs.comment_id }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          token_for_harness() {
            case "$1" in
              codex) printf '%s' "$CODEX_TOKEN" ;;
              antigravity) printf '%s' "$AGY_TOKEN" ;;
              *) printf '%s' "$GH_TOKEN" ;;
            esac
          }

          author_id=$(jq -r '.id // ""' <<< "$AUTHOR_JSON")
          author_harness=$(jq -r '.harness // ""' <<< "$AUTHOR_JSON")
          author_bot=$(jq -r '.botLogin // ""' <<< "$AUTHOR_JSON")
          author_cli_model=$(jq -r '.cliModel // ""' <<< "$AUTHOR_JSON")
          author_effort=$(jq -r '.effort // ""' <<< "$AUTHOR_JSON")
          author_display=$(jq -r '.displayName // ""' <<< "$AUTHOR_JSON")

          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ "$ACTION" == "review" ]]; then
              react_harness=$(jq -r '.[0].harness // ""' <<< "$REVIEWERS_JSON")
              [[ -z "$react_harness" ]] && react_harness="$author_harness"
            else
              react_harness="$author_harness"
            fi
            react_token=$(token_for_harness "$react_harness")
            # Prefer reacting as the starting bot App; fall back to github.token if the App lacks Issues write.
            if ! GH_TOKEN="$react_token" swift scripts/agent_review_loop.swift react \
              --repo "$GITHUB_REPOSITORY" \
              --event "$TRIGGER_EVENT" \
              --comment-id "$COMMENT_ID" \
              --content eyes >/dev/null 2>&1; then
              swift scripts/agent_review_loop.swift react \
                --repo "$GITHUB_REPOSITORY" \
                --event "$TRIGGER_EVENT" \
                --comment-id "$COMMENT_ID" \
                --content eyes >/dev/null || true
            fi
          fi

          create_check_run() {
            local harness="$1" name="$2" status="$3" title="$4" summary="$5" conclusion="${6:-}"
            local token
            token=$(token_for_harness "$harness")
            local args=(
              swift scripts/agent_review_loop.swift check-run
              --repo "$GITHUB_REPOSITORY"
              --name "$name"
              --head-sha "$PR_HEAD_SHA"
              --status "$status"
              --title "$title"
              --summary "$summary"
              --details-url "$run_url"
              --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$name"
            )
            if [[ -n "$conclusion" ]]; then
              args+=(--conclusion "$conclusion")
            fi
            # Use the bot App token so GitHub creates a dedicated check suite per bot.
            GH_TOKEN="$token" "${args[@]}" || true
          }

          if [[ "$DISCOVER_FAILED" == "true" ]]; then
            echo "Discovery failed: $DISCOVER_ERROR" >&2
            if [[ "$DRY_RUN" != "true" ]]; then
              if [[ "$ACTION" == "review" ]]; then
                failed_harness=$(jq -r '.[0].harness // ""' <<< "$REVIEWERS_JSON")
                failed_id=$(jq -r '.[0].id // ""' <<< "$REVIEWERS_JSON")
                [[ -z "$failed_harness" ]] && failed_harness="$author_harness"
                check_name="${failed_id:+review ($failed_id)}"
                check_name="${check_name:-review}"
              else
                failed_harness="$author_harness"
                check_name="${author_id:+address ($author_id)}"
                check_name="${check_name:-address}"
              fi
              create_check_run "$failed_harness" "$check_name" "completed" "Stopped" "$DISCOVER_ERROR" "failure" >/dev/null
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Agent review loop stopped: $DISCOVER_ERROR"
            fi
            exit 1
          fi

          review_check_runs_json="{}"
          address_check_run_id=""
          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ "$ACTION" == "review" ]]; then
              while IFS= read -r reviewer; do
                rev_id=$(jq -r '.id' <<< "$reviewer")
                rev_harness=$(jq -r '.harness' <<< "$reviewer")
                rev_bot=$(jq -r '.botLogin' <<< "$reviewer")
                rev_cli_model=$(jq -r '.cliModel' <<< "$reviewer")
                rev_effort=$(jq -r '.effort' <<< "$reviewer")
                rev_display=$(jq -r '.displayName' <<< "$reviewer")

                cid=$(create_check_run \
                  "$rev_harness" \
                  "review ($rev_id)" \
                  "queued" \
                  "Queued ($rev_display)" \
                  "Waiting for clinical-agents runner to review PR #$PR_NUMBER with $rev_display ($rev_effort).")
                review_check_runs_json=$(jq -c --arg k "$rev_id" --arg v "$cid" '.[$k] = $v' <<< "$review_check_runs_json")

                swift scripts/agent_review_loop.swift monitor-record \
                  --run-id "$GITHUB_RUN_ID" \
                  --kind "review-loop" \
                  --phase "review-$rev_id" \
                  --pr-number "$PR_NUMBER" \
                  --pr-branch "$PR_BRANCH" \
                  --head-sha "$PR_HEAD_SHA" \
                  --repo "$GITHUB_REPOSITORY" \
                  --run-url "$run_url" \
                  --harness "$rev_harness" \
                  --bot-login "$rev_bot" \
                  --model "$rev_cli_model" \
                  --effort "$rev_effort" \
                  --status queued >/dev/null || true
              done < <(jq -c '.[]' <<< "$REVIEWERS_JSON")

              address_check_run_id=$(create_check_run \
                "$author_harness" \
                "address ($author_id)" \
                "queued" \
                "Waiting for review ($author_display)" \
                "Will address review comments with $author_display ($author_effort) after review completes.")
              swift scripts/agent_review_loop.swift monitor-record \
                --run-id "$GITHUB_RUN_ID" \
                --kind "review-loop" \
                --phase address \
                --pr-number "$PR_NUMBER" \
                --pr-branch "$PR_BRANCH" \
                --head-sha "$PR_HEAD_SHA" \
                --repo "$GITHUB_REPOSITORY" \
                --run-url "$run_url" \
                --harness "$author_harness" \
                --bot-login "$author_bot" \
                --model "$author_cli_model" \
                --effort "$author_effort" \
                --status queued >/dev/null || true
            else
              address_check_run_id=$(create_check_run \
                "$author_harness" \
                "address ($author_id)" \
                "queued" \
                "Queued ($author_display)" \
                "Waiting for clinical-agents runner to address PR #$PR_NUMBER with $author_display ($author_effort).")
              swift scripts/agent_review_loop.swift monitor-record \
                --run-id "$GITHUB_RUN_ID" \
                --kind "review-loop" \
                --phase address \
                --pr-number "$PR_NUMBER" \
                --pr-branch "$PR_BRANCH" \
                --head-sha "$PR_HEAD_SHA" \
                --repo "$GITHUB_REPOSITORY" \
                --run-url "$run_url" \
                --harness "$author_harness" \
                --bot-login "$author_bot" \
                --model "$author_cli_model" \
                --effort "$author_effort" \
                --status queued >/dev/null || true
            fi
          fi

          {
            echo "review_check_runs_json=$review_check_runs_json"
            echo "address_check_run_id=$address_check_run_id"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Review PR
    needs: plan
    if: needs.plan.outputs.run_review == 'true'
    runs-on: clinical-agents
    timeout-minutes: 30
    outputs:
      pr_head_sha: ${{ steps.sync-head.outputs.pr_head_sha }}
      address_check_run_id: ${{ steps.sync-head.outputs.address_check_run_id }}
      any_succeeded: ${{ steps.run-reviews.outputs.any_succeeded }}
    steps:
      - name: Add Homebrew tools to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Create Codex App token
        id: codex-token
        if: needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.needs_codex_token == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_CODEX_APP_ID || secrets.CLINICAL_CODEX_APP_ID }}
          private-key: ${{ secrets.CLINICAL_CODEX_PRIVATE_KEY }}

      - name: Create Antigravity App token
        id: agy-token
        if: needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.needs_agy_token == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_ANTIGRAVITY_APP_ID || secrets.CLINICAL_ANTIGRAVITY_APP_ID }}
          private-key: ${{ secrets.CLINICAL_ANTIGRAVITY_PRIVATE_KEY }}

      - name: Sync PR head if worktree advanced
        id: sync-head
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TOKEN: ${{ steps.codex-token.outputs.token }}
          AGY_TOKEN: ${{ steps.agy-token.outputs.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_BRANCH: ${{ needs.plan.outputs.pr_branch }}
          PLANNED_HEAD_SHA: ${{ needs.plan.outputs.pr_head_sha }}
          REVIEWER_OVERRIDE: ${{ needs.plan.outputs.reviewer_override }}
          REVIEW_ALL: ${{ needs.plan.outputs.review_all }}
          AUTHOR_OVERRIDE: ${{ needs.plan.outputs.author_override }}
          REVIEWERS_JSON: ${{ needs.plan.outputs.reviewers_json }}
          AUTHOR_JSON: ${{ needs.plan.outputs.author_json }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          REVIEW_CHECK_RUNS_JSON: ${{ needs.plan.outputs.review_check_runs_json }}
          ADDRESS_CHECK_RUN_ID: ${{ needs.plan.outputs.address_check_run_id }}
        run: |
          set -euo pipefail
          token_for_harness() {
            case "$1" in
              codex) printf '%s' "$CODEX_TOKEN" ;;
              antigravity) printf '%s' "$AGY_TOKEN" ;;
              *) printf '%s' "$GH_TOKEN" ;;
            esac
          }

          pr_head_sha="$PLANNED_HEAD_SHA"
          review_check_runs_json="$REVIEW_CHECK_RUNS_JSON"
          address_check_run_id="$ADDRESS_CHECK_RUN_ID"

          live_head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')

          if [[ -n "$live_head_sha" && "$live_head_sha" != "$pr_head_sha" ]]; then
            script="$GITHUB_WORKSPACE/main/scripts/agent_review_loop.swift"
            discover_args=(
              discover
              --repo "$CANONICAL_REPO_PATH"
              --branch "$PR_BRANCH"
              --head-sha "$live_head_sha"
              --action review
              --require-clean
            )
            if [[ -n "$REVIEWER_OVERRIDE" ]]; then
              discover_args+=(--reviewers "$REVIEWER_OVERRIDE")
            fi
            if [[ "$REVIEW_ALL" == "true" ]]; then
              discover_args+=(--review-all)
            fi
            if [[ -n "$AUTHOR_OVERRIDE" ]]; then
              discover_args+=(--author "$AUTHOR_OVERRIDE")
            fi

            set +e
            swift "$script" "${discover_args[@]}" >/dev/null
            discover_status=$?
            set -e

            if [[ $discover_status -eq 0 ]]; then
              echo "Advancing target PR head from $pr_head_sha to $live_head_sha."
              pr_head_sha="$live_head_sha"
              if [[ "$DRY_RUN" != "true" ]]; then
                swift "$script" monitor-record \
                  --run-id "$GITHUB_RUN_ID" \
                  --head-sha "$live_head_sha" >/dev/null || true
                run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

                new_review_checks="{}"
                while IFS= read -r reviewer; do
                  rev_id=$(jq -r '.id' <<< "$reviewer")
                  rev_harness=$(jq -r '.harness' <<< "$reviewer")
                  rev_display=$(jq -r '.displayName' <<< "$reviewer")
                  rev_effort=$(jq -r '.effort' <<< "$reviewer")
                  rev_token=$(token_for_harness "$rev_harness")
                  old_cid=$(jq -r --arg k "$rev_id" '.[$k] // ""' <<< "$review_check_runs_json")
                  if [[ -n "$old_cid" ]]; then
                    GH_TOKEN="$rev_token" swift "$script" check-run \
                      --repo "$GITHUB_REPOSITORY" \
                      --check-run-id "$old_cid" \
                      --status completed \
                      --conclusion skipped \
                      --title "Superseded ($rev_display)" \
                      --summary "Superseded by newer commit $live_head_sha before review started." \
                      --details-url "$run_url" >/dev/null || true
                  fi
                  new_cid=$(GH_TOKEN="$rev_token" swift "$script" check-run \
                    --repo "$GITHUB_REPOSITORY" \
                    --name "review ($rev_id)" \
                    --head-sha "$live_head_sha" \
                    --status queued \
                    --title "Queued ($rev_display)" \
                    --summary "Waiting for clinical-agents runner to review PR #$PR_NUMBER with $rev_display ($rev_effort)." \
                    --details-url "$run_url" \
                    --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-review-$rev_id" || true)
                  new_review_checks=$(jq -c --arg k "$rev_id" --arg v "$new_cid" '.[$k] = $v' <<< "$new_review_checks")
                done < <(jq -c '.[]' <<< "$REVIEWERS_JSON")
                review_check_runs_json="$new_review_checks"

                author_id=$(jq -r '.id' <<< "$AUTHOR_JSON")
                author_harness=$(jq -r '.harness' <<< "$AUTHOR_JSON")
                author_display=$(jq -r '.displayName' <<< "$AUTHOR_JSON")
                author_effort=$(jq -r '.effort' <<< "$AUTHOR_JSON")
                author_token=$(token_for_harness "$author_harness")
                if [[ -n "$address_check_run_id" ]]; then
                  GH_TOKEN="$author_token" swift "$script" check-run \
                    --repo "$GITHUB_REPOSITORY" \
                    --check-run-id "$address_check_run_id" \
                    --status completed \
                    --conclusion skipped \
                    --title "Superseded ($author_display)" \
                    --summary "Superseded by newer commit $live_head_sha before review started." \
                    --details-url "$run_url" >/dev/null || true
                fi
                address_check_run_id=$(GH_TOKEN="$author_token" swift "$script" check-run \
                  --repo "$GITHUB_REPOSITORY" \
                  --name "address ($author_id)" \
                  --head-sha "$live_head_sha" \
                  --status queued \
                  --title "Waiting for review ($author_display)" \
                  --summary "Will address review comments with $author_display ($author_effort) after review completes." \
                  --details-url "$run_url" \
                  --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-address-$author_id" || true)
              fi
            fi
          fi

          {
            echo "pr_head_sha=$pr_head_sha"
            echo "review_check_runs_json=$review_check_runs_json"
            echo "address_check_run_id=$address_check_run_id"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sync-head.outputs.pr_head_sha }}
          path: pr-base
          fetch-depth: 0
          persist-credentials: false

      - name: Run reviewer agents
        id: run-reviews
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TOKEN: ${{ steps.codex-token.outputs.token }}
          AGY_TOKEN: ${{ steps.agy-token.outputs.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.sync-head.outputs.pr_head_sha }}
          REVIEWERS_JSON: ${{ needs.plan.outputs.reviewers_json }}
          REVIEW_CHECK_RUNS_JSON: ${{ steps.sync-head.outputs.review_check_runs_json }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          main_dir="$GITHUB_WORKSPACE/main"
          script="$main_dir/scripts/agent_review_loop.swift"
          pr_base_dir=$(cd "$GITHUB_WORKSPACE/pr-base" && pwd -P)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          state_dir="$GITHUB_WORKSPACE/.review-state"
          rm -rf "$state_dir"
          mkdir -p "$state_dir"

          token_for_harness() {
            case "$1" in
              codex) printf '%s' "$CODEX_TOKEN" ;;
              antigravity) printf '%s' "$AGY_TOKEN" ;;
              *) printf '%s' "$GH_TOKEN" ;;
            esac
          }

          reviewer_count=$(jq -r 'length' <<< "$REVIEWERS_JSON")
          echo "state_dir=$state_dir" >> "$GITHUB_OUTPUT"

          declare -a pids=()
          declare -a rev_ids=()
          declare -a rev_harnesses=()
          declare -a rev_displays=()
          declare -a rev_stream_files=()
          declare -a rev_worktrees=()

          while IFS= read -r reviewer; do
            rev_id=$(jq -r '.id' <<< "$reviewer")
            rev_harness=$(jq -r '.harness' <<< "$reviewer")
            rev_bot=$(jq -r '.botLogin' <<< "$reviewer")
            rev_cli_model=$(jq -r '.cliModel' <<< "$reviewer")
            rev_effort=$(jq -r '.effort' <<< "$reviewer")
            rev_display=$(jq -r '.displayName' <<< "$reviewer")
            rev_token=$(token_for_harness "$rev_harness")
            phase="review-$rev_id"

            if [[ "$reviewer_count" -eq 1 ]]; then
              checkout_dir="$pr_base_dir"
            elif [[ "$DRY_RUN" == "true" ]]; then
              checkout_dir="$GITHUB_WORKSPACE/pr-$rev_id"
            else
              checkout_dir="$GITHUB_WORKSPACE/pr-$rev_id"
              rm -rf "$checkout_dir"
              git -C "$pr_base_dir" worktree prune >/dev/null 2>&1 || true
              git -C "$pr_base_dir" worktree add --detach "$checkout_dir" "$PR_HEAD_SHA" >/dev/null
              checkout_dir=$(cd "$checkout_dir" && pwd -P)
            fi

            prompt="Review PR #$PR_NUMBER in $GITHUB_REPOSITORY using the my-review skill. You are running in a clean checkout of the PR head (do not modify files). Skip routine builds and test runs; the author and CI already run them. Run a targeted build or test only to confirm a specific suspected defect. Your assigned GitHub App identity is $rev_bot ($rev_display · $rev_effort)."

            if [[ "$rev_harness" == "codex" ]]; then
              skills_repo=$([[ "$DRY_RUN" == "true" ]] && echo "$pr_base_dir" || echo "$checkout_dir")
              skills_config=$(swift "$script" codex-skills-config \
                --repo "$skills_repo" --allow my-review,my-design-review)
              cmd=(
                codex exec --ignore-user-config --dangerously-bypass-hook-trust --json
                -C "$checkout_dir"
                -c "projects={\"$checkout_dir\"={trust_level=\"trusted\"}}"
                -m "$rev_cli_model"
                -c "model_reasoning_effort=$rev_effort"
                -c 'sandbox_mode="danger-full-access"'
                -c 'web_search="live"'
                --disable apps --disable plugins
                --disable browser_use --disable browser_use_external --disable browser_use_full_cdp_access
                --disable computer_use --disable in_app_browser --disable image_generation
                -c "skills.config=$skills_config"
                "$prompt"
              )
            else
              cmd=(
                agy --model "$rev_cli_model" --effort "$rev_effort"
                --output-format stream-json -p "$prompt"
              )
            fi

            if [[ "$DRY_RUN" == "true" ]]; then
              echo "=== DRY RUN: $phase ==="
              echo "Model:    $rev_id ($rev_display · $rev_effort)"
              echo "Harness:  $rev_harness ($rev_bot)"
              echo "Checkout: $checkout_dir"
              echo "Prompt:   $prompt"
              printf 'Command:  '
              printf '%q ' "${cmd[@]}"
              echo
              echo "success" > "$state_dir/done-$rev_id"
              continue
            fi

            planned_cid=$(jq -r --arg k "$rev_id" '.[$k] // ""' <<< "$REVIEW_CHECK_RUNS_JSON")
            effective_cid="$planned_cid"
            if [[ -n "$planned_cid" ]]; then
              effective_cid=$(GH_TOKEN="$rev_token" swift "$script" check-run \
                --repo "$GITHUB_REPOSITORY" \
                --check-run-id "$planned_cid" \
                --name "review ($rev_id)" \
                --head-sha "$PR_HEAD_SHA" \
                --status in_progress \
                --recreate-if-completed \
                --title "Reviewing PR ($rev_display)" \
                --summary "Running $rev_display ($rev_effort) on PR #$PR_NUMBER." \
                --details-url "$run_url" \
                --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-review-$rev_id" || true)
              effective_cid="${effective_cid:-$planned_cid}"
            fi
            printf '%s' "$effective_cid" > "$state_dir/check-$rev_id.id"

            stream_file="$AGENT_MONITOR_DIR/runs/$GITHUB_RUN_ID/$phase.jsonl"
            mkdir -p "$(dirname "$stream_file")"
            swift "$script" monitor-record \
              --run-id "$GITHUB_RUN_ID" \
              --phase "$phase" \
              --harness "$rev_harness" \
              --bot-login "$rev_bot" \
              --model "$rev_cli_model" \
              --effort "$rev_effort" \
              --worktree "$checkout_dir" \
              --prompt "$prompt" \
              --stream-file "$stream_file" \
              --status running >/dev/null || true

            (
              export GH_TOKEN="$rev_token"
              cd "$checkout_dir"
              if [[ "$reviewer_count" -eq 1 ]]; then
                "${cmd[@]}" 2>&1 | tee "$stream_file"
              else
                "${cmd[@]}" >"$stream_file" 2>&1
              fi
            ) &
            pids+=($!)
            rev_ids+=("$rev_id")
            rev_harnesses+=("$rev_harness")
            rev_displays+=("$rev_display")
            rev_stream_files+=("$stream_file")
            rev_worktrees+=("$checkout_dir")
          done < <(jq -c '.[]' <<< "$REVIEWERS_JSON")

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "any_succeeded=true" >> "$GITHUB_OUTPUT"
            echo "failed_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          succeeded_count=0
          failed_count=0
          for i in "${!pids[@]}"; do
            pid="${pids[$i]}"
            rev_id="${rev_ids[$i]}"
            rev_harness="${rev_harnesses[$i]}"
            rev_display="${rev_displays[$i]}"
            stream_file="${rev_stream_files[$i]}"
            checkout_dir="${rev_worktrees[$i]}"
            rev_token=$(token_for_harness "$rev_harness")
            phase="review-$rev_id"

            set +e
            wait "$pid"
            rc=$?
            set -e

            if [[ $rc -eq 0 ]]; then
              conclusion="success"
              title="Review complete ($rev_display)"
              succeeded_count=$((succeeded_count + 1))
            else
              conclusion="failure"
              title="Review failed ($rev_display)"
              failed_count=$((failed_count + 1))
            fi

            if [[ "$reviewer_count" -gt 1 ]]; then
              echo "=== Reviewer $rev_id ($rev_display) finished with $conclusion (exit $rc) ==="
              tail -n 40 "$stream_file" || true
              git -C "$pr_base_dir" worktree remove --force "$checkout_dir" >/dev/null 2>&1 || rm -rf "$checkout_dir"
            fi

            cid=$(cat "$state_dir/check-$rev_id.id" 2>/dev/null || true)
            if [[ -n "$cid" ]]; then
              GH_TOKEN="$rev_token" swift "$script" check-run \
                --repo "$GITHUB_REPOSITORY" \
                --check-run-id "$cid" \
                --status completed \
                --conclusion "$conclusion" \
                --title "$title" \
                --summary "Reviewer $rev_display finished with status $conclusion on PR #$PR_NUMBER." \
                --details-url "$run_url" >/dev/null || true
            fi

            swift "$script" monitor-record \
              --run-id "$GITHUB_RUN_ID" \
              --phase "$phase" \
              --status completed \
              --conclusion "$conclusion" >/dev/null || true

            echo "$conclusion" > "$state_dir/done-$rev_id"
          done

          any_succeeded=$([[ $succeeded_count -gt 0 ]] && echo true || echo false)
          echo "any_succeeded=$any_succeeded" >> "$GITHUB_OUTPUT"
          echo "failed_count=$failed_count" >> "$GITHUB_OUTPUT"

      - name: Finalize review job
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TOKEN: ${{ steps.codex-token.outputs.token }}
          AGY_TOKEN: ${{ steps.agy-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          REVIEWERS_JSON: ${{ needs.plan.outputs.reviewers_json }}
          AUTHOR_JSON: ${{ needs.plan.outputs.author_json }}
          REVIEW_CHECK_RUNS_JSON: ${{ steps.sync-head.outputs.review_check_runs_json || needs.plan.outputs.review_check_runs_json }}
          ADDRESS_CHECK_RUN_ID: ${{ steps.sync-head.outputs.address_check_run_id || needs.plan.outputs.address_check_run_id }}
          ANY_SUCCEEDED: ${{ steps.run-reviews.outputs.any_succeeded }}
          FAILED_COUNT: ${{ steps.run-reviews.outputs.failed_count || '0' }}
          STATE_DIR: ${{ steps.run-reviews.outputs.state_dir }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            exit 0
          fi

          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          script="$GITHUB_WORKSPACE/main/scripts/agent_review_loop.swift"
          token_for_harness() {
            case "$1" in
              codex) printf '%s' "$CODEX_TOKEN" ;;
              antigravity) printf '%s' "$AGY_TOKEN" ;;
              *) printf '%s' "$GH_TOKEN" ;;
            esac
          }

          fallback_conclusion=$([[ "$JOB_STATUS" == "cancelled" ]] && echo cancelled || echo failure)

          while IFS= read -r reviewer; do
            rev_id=$(jq -r '.id' <<< "$reviewer")
            rev_harness=$(jq -r '.harness' <<< "$reviewer")
            rev_display=$(jq -r '.displayName' <<< "$reviewer")
            if [[ -n "$STATE_DIR" && -f "$STATE_DIR/done-$rev_id" ]]; then
              continue
            fi
            rev_token=$(token_for_harness "$rev_harness")
            cid=""
            if [[ -n "$STATE_DIR" && -f "$STATE_DIR/check-$rev_id.id" ]]; then
              cid=$(cat "$STATE_DIR/check-$rev_id.id" 2>/dev/null || true)
            fi
            if [[ -z "$cid" && -n "$REVIEW_CHECK_RUNS_JSON" ]]; then
              cid=$(jq -r --arg k "$rev_id" '.[$k] // ""' <<< "$REVIEW_CHECK_RUNS_JSON")
            fi
            if [[ -n "$cid" ]]; then
              GH_TOKEN="$rev_token" swift "$script" check-run \
                --repo "$GITHUB_REPOSITORY" \
                --check-run-id "$cid" \
                --status completed \
                --conclusion "$fallback_conclusion" \
                --title "Review $fallback_conclusion ($rev_display)" \
                --summary "Reviewer $rev_display ended with status $fallback_conclusion on PR #$PR_NUMBER." \
                --details-url "$run_url" >/dev/null || true
            fi
            swift "$script" monitor-record \
              --run-id "$GITHUB_RUN_ID" \
              --phase "review-$rev_id" \
              --status completed \
              --conclusion "$fallback_conclusion" >/dev/null || true
          done < <(jq -c '.[]' <<< "$REVIEWERS_JSON")

          if [[ "$ANY_SUCCEEDED" != "true" && -n "$ADDRESS_CHECK_RUN_ID" ]]; then
            author_harness=$(jq -r '.harness' <<< "$AUTHOR_JSON")
            author_display=$(jq -r '.displayName' <<< "$AUTHOR_JSON")
            author_token=$(token_for_harness "$author_harness")
            GH_TOKEN="$author_token" swift "$script" check-run \
              --repo "$GITHUB_REPOSITORY" \
              --check-run-id "$ADDRESS_CHECK_RUN_ID" \
              --status completed \
              --conclusion skipped \
              --title "Address skipped ($author_display)" \
              --summary "Skipped because no review succeeded." \
              --details-url "$run_url" >/dev/null || true
            swift "$script" monitor-record \
              --run-id "$GITHUB_RUN_ID" \
              --phase address \
              --status completed \
              --conclusion skipped >/dev/null || true
          fi

          if [[ "$FAILED_COUNT" -gt 0 || "$ANY_SUCCEEDED" != "true" ]]; then
            exit 1
          fi

  address:
    name: Address review comments
    needs: [plan, review]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.run_address == 'true' &&
      (needs.plan.outputs.run_review != 'true' || needs.review.outputs.any_succeeded == 'true')
    runs-on: clinical-agents
    timeout-minutes: 45
    steps:
      - name: Add Homebrew tools to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Create Codex author App token
        id: codex-token
        if: needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.author_harness == 'codex'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_CODEX_APP_ID || secrets.CLINICAL_CODEX_APP_ID }}
          private-key: ${{ secrets.CLINICAL_CODEX_PRIVATE_KEY }}

      - name: Create Antigravity author App token
        id: agy-token
        if: needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.author_harness == 'antigravity'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_ANTIGRAVITY_APP_ID || secrets.CLINICAL_ANTIGRAVITY_APP_ID }}
          private-key: ${{ secrets.CLINICAL_ANTIGRAVITY_PRIVATE_KEY }}

      - name: Verify PR comments and worktree
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_TOKEN: ${{ steps.codex-token.outputs.token || steps.agy-token.outputs.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_BRANCH: ${{ needs.plan.outputs.pr_branch }}
          PR_HEAD_SHA: ${{ needs.review.outputs.pr_head_sha || needs.plan.outputs.pr_head_sha }}
          RUN_REVIEW: ${{ needs.plan.outputs.run_review }}
          AUTHOR_OVERRIDE: ${{ needs.plan.outputs.author_override }}
          AUTHOR_JSON: ${{ needs.plan.outputs.author_json }}
          CHECK_RUN_ID: ${{ needs.review.outputs.address_check_run_id || needs.plan.outputs.address_check_run_id }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/scripts/agent_review_loop.swift"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          author_id=$(jq -r '.id' <<< "$AUTHOR_JSON")
          author_display=$(jq -r '.displayName' <<< "$AUTHOR_JSON")

          live_head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')

          if [[ -n "$live_head_sha" && "$live_head_sha" != "$PR_HEAD_SHA" ]]; then
            reason="New commits were pushed during review; skipping address on stale review."
            echo "$reason ($PR_HEAD_SHA -> $live_head_sha)"
            if [[ "$DRY_RUN" != "true" ]]; then
              if [[ -n "$CHECK_RUN_ID" ]]; then
                GH_TOKEN="$AUTHOR_TOKEN" swift "$script" check-run \
                  --repo "$GITHUB_REPOSITORY" \
                  --check-run-id "$CHECK_RUN_ID" \
                  --status completed \
                  --conclusion skipped \
                  --title "Address skipped ($author_display)" \
                  --summary "$reason" \
                  --details-url "$run_url" >/dev/null || true
              fi
              GH_TOKEN="$AUTHOR_TOKEN" swift "$script" check-run \
                --repo "$GITHUB_REPOSITORY" \
                --name "address ($author_id)" \
                --head-sha "$live_head_sha" \
                --status completed \
                --conclusion skipped \
                --title "Address skipped ($author_display)" \
                --summary "$reason" \
                --details-url "$run_url" \
                --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-address-stale" >/dev/null || true
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Agent address job stopped: $reason"
              swift "$script" monitor-record \
                --run-id "$GITHUB_RUN_ID" \
                --phase address \
                --status completed \
                --conclusion skipped >/dev/null || true
            fi
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unresolved_count=$(swift "$script" unresolved-review-threads \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER")

          if [[ "$unresolved_count" -eq 0 ]]; then
            if [[ "$DRY_RUN" == "true" && "$RUN_REVIEW" == "true" ]]; then
              echo "DRY RUN: PR #$PR_NUMBER has no unresolved review comments (continuing to print address dry-run plan because review was a dry run)."
            else
              reason="No unresolved review comments on PR #$PR_NUMBER."
              echo "$reason Skipping address."
              if [[ "$DRY_RUN" != "true" ]]; then
                if [[ -n "$CHECK_RUN_ID" ]]; then
                  GH_TOKEN="$AUTHOR_TOKEN" swift "$script" check-run \
                    --repo "$GITHUB_REPOSITORY" \
                    --check-run-id "$CHECK_RUN_ID" \
                    --status completed \
                    --conclusion skipped \
                    --title "Address skipped ($author_display)" \
                    --summary "$reason" \
                    --details-url "$run_url" >/dev/null || true
                fi
                swift "$script" monitor-record \
                  --run-id "$GITHUB_RUN_ID" \
                  --phase address \
                  --status completed \
                  --conclusion skipped >/dev/null || true
              fi
              echo "skipped=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "Found $unresolved_count unresolved review thread(s) on PR #$PR_NUMBER."
          fi

          discover_args=(
            discover
            --repo "$CANONICAL_REPO_PATH"
            --branch "$PR_BRANCH"
            --head-sha "$PR_HEAD_SHA"
            --action address
            --require-clean
          )
          if [[ -n "$AUTHOR_OVERRIDE" ]]; then
            discover_args+=(--author "$AUTHOR_OVERRIDE")
          else
            discover_args+=(--author "$author_id")
          fi

          set +e
          discovery_json=$(swift scripts/agent_review_loop.swift "${discover_args[@]}")
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            reason=$(jq -r '.error // "Worktree safety check failed."' <<< "$discovery_json")
            echo "Worktree safety check failed: $reason" >&2
            if [[ "$DRY_RUN" != "true" ]]; then
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Agent address job stopped: $reason"
            fi
            exit 1
          fi

          worktree_path=$(jq -r '.worktreePath' <<< "$discovery_json")
          {
            echo "skipped=false"
            echo "worktree_path=$worktree_path"
            echo "address_check_run_id=$CHECK_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Mark address check in progress
        id: mark-in-progress
        if: steps.verify.outputs.skipped != 'true' && needs.plan.outputs.dry_run != 'true' && steps.verify.outputs.address_check_run_id != ''
        env:
          GH_TOKEN: ${{ steps.codex-token.outputs.token || steps.agy-token.outputs.token }}
          CHECK_RUN_ID: ${{ steps.verify.outputs.address_check_run_id }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.review.outputs.pr_head_sha || needs.plan.outputs.pr_head_sha }}
          AUTHOR_JSON: ${{ needs.plan.outputs.author_json }}
        run: |
          author_id=$(jq -r '.id' <<< "$AUTHOR_JSON")
          author_display=$(jq -r '.displayName' <<< "$AUTHOR_JSON")
          author_effort=$(jq -r '.effort' <<< "$AUTHOR_JSON")
          effective_id=$(swift "$GITHUB_WORKSPACE/scripts/agent_review_loop.swift" check-run \
            --repo "$GITHUB_REPOSITORY" \
            --check-run-id "$CHECK_RUN_ID" \
            --name "address ($author_id)" \
            --head-sha "$PR_HEAD_SHA" \
            --status in_progress \
            --recreate-if-completed \
            --title "Addressing review comments ($author_display)" \
            --summary "Running $author_display ($author_effort) on PR #$PR_NUMBER." \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-address-$author_id" || true)
          echo "check_run_id=${effective_id:-$CHECK_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Run author agent
        if: steps.verify.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ steps.codex-token.outputs.token || steps.agy-token.outputs.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          WORKTREE_PATH: ${{ steps.verify.outputs.worktree_path }}
          AUTHOR_JSON: ${{ needs.plan.outputs.author_json }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          main_dir="$GITHUB_WORKSPACE"
          worktree_dir=$(cd "$WORKTREE_PATH" && pwd -P)
          author_id=$(jq -r '.id' <<< "$AUTHOR_JSON")
          author_harness=$(jq -r '.harness' <<< "$AUTHOR_JSON")
          bot_login=$(jq -r '.botLogin' <<< "$AUTHOR_JSON")
          author_model=$(jq -r '.cliModel' <<< "$AUTHOR_JSON")
          author_effort=$(jq -r '.effort' <<< "$AUTHOR_JSON")
          author_display=$(jq -r '.displayName' <<< "$AUTHOR_JSON")

          prompt="Address review comments on PR #$PR_NUMBER in $GITHUB_REPOSITORY using the my-address-review skill. Your assigned GitHub App identity is $bot_login ($author_display · $author_effort)."

          if [[ "$author_harness" == "codex" ]]; then
            skills_config=$(swift "$main_dir/scripts/agent_review_loop.swift" codex-skills-config \
              --repo "$worktree_dir" --allow my-address-review,my-design-review)
            cmd=(
              codex exec --ignore-user-config --dangerously-bypass-hook-trust --json
              -C "$worktree_dir"
              -c "projects={\"$worktree_dir\"={trust_level=\"trusted\"}}"
              -m "$author_model"
              -c "model_reasoning_effort=$author_effort"
              -c 'sandbox_mode="danger-full-access"'
              -c 'web_search="live"'
              --disable apps
              --disable browser_use --disable browser_use_external --disable browser_use_full_cdp_access
              --disable computer_use --disable in_app_browser --disable image_generation
              -c plugins.build-ios-apps@openai-curated-remote.enabled=true
              -c "skills.config=$skills_config"
              "$prompt"
            )
          else
            cmd=(
              agy --model "$author_model" --effort "$author_effort"
              --output-format stream-json -p "$prompt"
            )
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "=== DRY RUN: address ==="
            echo "Model:    $author_id ($author_display · $author_effort)"
            echo "Harness:  $author_harness ($bot_login)"
            echo "Worktree: $worktree_dir"
            echo "Prompt:   $prompt"
            printf 'Command:  '
            printf '%q ' "${cmd[@]}"
            echo
            exit 0
          fi

          stream_file="$AGENT_MONITOR_DIR/runs/$GITHUB_RUN_ID/address.jsonl"
          mkdir -p "$(dirname "$stream_file")"
          swift "$main_dir/scripts/agent_review_loop.swift" monitor-record \
            --run-id "$GITHUB_RUN_ID" \
            --phase address \
            --harness "$author_harness" \
            --bot-login "$bot_login" \
            --model "$author_model" \
            --effort "$author_effort" \
            --worktree "$worktree_dir" \
            --prompt "$prompt" \
            --stream-file "$stream_file" \
            --status running >/dev/null || true

          cd "$worktree_dir"
          "${cmd[@]}" 2>&1 | tee "$stream_file"

      - name: Complete address check
        if: always() && steps.verify.outputs.skipped != 'true' && needs.plan.outputs.dry_run != 'true' && (steps.mark-in-progress.outputs.check_run_id || steps.verify.outputs.address_check_run_id || needs.review.outputs.address_check_run_id || needs.plan.outputs.address_check_run_id) != ''
        env:
          GH_TOKEN: ${{ steps.codex-token.outputs.token || steps.agy-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          CHECK_RUN_ID: ${{ steps.mark-in-progress.outputs.check_run_id || steps.verify.outputs.address_check_run_id || needs.review.outputs.address_check_run_id || needs.plan.outputs.address_check_run_id }}
          AUTHOR_JSON: ${{ needs.plan.outputs.author_json }}
        run: |
          author_display=$(jq -r '.displayName' <<< "$AUTHOR_JSON")
          case "$JOB_STATUS" in
            success) conclusion="success"; title="Address complete ($author_display)" ;;
            cancelled) conclusion="cancelled"; title="Address cancelled ($author_display)" ;;
            *) conclusion="failure"; title="Address failed ($author_display)" ;;
          esac

          swift "$GITHUB_WORKSPACE/scripts/agent_review_loop.swift" check-run \
            --repo "$GITHUB_REPOSITORY" \
            --check-run-id "$CHECK_RUN_ID" \
            --status completed \
            --conclusion "$conclusion" \
            --title "$title" \
            --summary "Author $author_display finished with status $JOB_STATUS on PR #$PR_NUMBER." \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null || true

          swift "$GITHUB_WORKSPACE/scripts/agent_review_loop.swift" monitor-record \
            --run-id "$GITHUB_RUN_ID" \
            --phase address \
            --status completed \
            --conclusion "$conclusion" >/dev/null || true
