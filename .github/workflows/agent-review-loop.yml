name: Agent review loop

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      action:
        description: Action to run
        required: true
        default: review
        type: choice
        options:
          - review
          - address
      reviewer:
        description: Reviewer harness override (for review action)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - codex
          - antigravity
      dry_run:
        description: Print commands and plan without running agents or posting to GitHub
        required: false
        default: true
        type: boolean

concurrency:
  group: agent-review-loop-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  checks: write

env:
  CODEX_REVIEWER_MODEL: gpt-6.1-sol
  CODEX_REVIEWER_EFFORT: high
  CODEX_AUTHOR_MODEL: gpt-6.1-sol
  CODEX_AUTHOR_EFFORT: high
  AGY_REVIEWER_MODEL: gemini-4-hydrogen
  AGY_REVIEWER_EFFORT: high
  AGY_AUTHOR_MODEL: gemini-4-hydrogen
  AGY_AUTHOR_EFFORT: high
  CANONICAL_REPO_PATH: /Users/vicky/code/clinical-swift
  SUPER_ENGINEERING_DB: /Users/vicky/.super.engineering/db/super.engineering.db
  AGENT_MONITOR_DIR: /Users/vicky/.clinical-agent-monitor

jobs:
  plan:
    name: Plan review loop
    if: >-
      (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.comment.user.login == github.repository_owner &&
       (startsWith(github.event.comment.body, '/review') ||
        startsWith(github.event.comment.body, '/address')))
    runs-on: clinical-agents
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      pr_branch: ${{ steps.resolve.outputs.pr_branch }}
      pr_head_sha: ${{ steps.resolve.outputs.pr_head_sha }}
      run_review: ${{ steps.resolve.outputs.run_review }}
      run_address: ${{ steps.resolve.outputs.run_address }}
      reviewer_override: ${{ steps.resolve.outputs.reviewer_override }}
      reviewer_harness: ${{ steps.resolve.outputs.reviewer_harness }}
      author_harness: ${{ steps.resolve.outputs.author_harness }}
      worktree_path: ${{ steps.resolve.outputs.worktree_path }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      review_check_run_id: ${{ steps.create-checks.outputs.review_check_run_id }}
      address_check_run_id: ${{ steps.create-checks.outputs.address_check_run_id }}
    steps:
      - name: Add Homebrew tools to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Resolve trigger, PR metadata, and worktree harness
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_ACTION: ${{ inputs.action }}
          DISPATCH_REVIEWER: ${{ inputs.reviewer }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          write_multiline_output() {
            local key="$1" value="$2"
            local delim
            delim="EOF_$(openssl rand -hex 16)"
            {
              echo "$key<<$delim"
              printf '%s\n' "$value"
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          }

          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            # Ignore normal prose that happens to start with /reviewing or /addressing.
            first_token=$(printf '%s' "$COMMENT_BODY" | awk 'NR==1 { print $1 }')
            if [[ "$first_token" != "/review" && "$first_token" != "/address" ]]; then
              echo "Ignoring non-command comment."
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              echo "run_address=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! trigger_json=$(swift scripts/agent_review_loop.swift parse-trigger \
            --event "$EVENT_NAME" \
            --body "$COMMENT_BODY" \
            --action "$DISPATCH_ACTION" \
            --reviewer "$DISPATCH_REVIEWER" \
            --pr-number "$DISPATCH_PR_NUMBER" \
            --dry-run "$DISPATCH_DRY_RUN" 2>&1); then
            echo "Trigger parse failed: $trigger_json" >&2
            if [[ "$EVENT_NAME" == "issue_comment" && "$DISPATCH_DRY_RUN" != "true" ]]; then
              gh pr comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Agent review loop stopped: $trigger_json"
            fi
            exit 1
          fi

          action=$(jq -r '.action' <<< "$trigger_json")
          reviewer_override=$(jq -r '.reviewerOverride // ""' <<< "$trigger_json")
          dry_run=$(jq -r '.dryRun' <<< "$trigger_json")
          if [[ "$EVENT_NAME" == "issue_comment" ]]; then
            pr_number="$ISSUE_NUMBER"
          else
            pr_number=$(jq -r '.prNumber' <<< "$trigger_json")
          fi

          pr_json=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
            --json number,state,headRefName,headRefOid,url)
          pr_state=$(jq -r '.state' <<< "$pr_json")
          pr_branch=$(jq -r '.headRefName' <<< "$pr_json")
          pr_head_sha=$(jq -r '.headRefOid' <<< "$pr_json")

          if [[ "$pr_state" != "OPEN" ]]; then
            reason="PR #$pr_number is $pr_state (expected OPEN)."
            echo "$reason" >&2
            if [[ "$dry_run" != "true" ]]; then
              gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" \
                --body "Agent review loop stopped: $reason"
            fi
            exit 1
          fi

          discover_args=(
            discover
            --repo "$CANONICAL_REPO_PATH"
            --branch "$pr_branch"
            --head-sha "$pr_head_sha"
            --action "$action"
            --super-db "$SUPER_ENGINEERING_DB"
            --require-clean
          )
          if [[ -n "$reviewer_override" ]]; then
            discover_args+=(--reviewer "$reviewer_override")
          fi

          set +e
          discovery_json=$(swift scripts/agent_review_loop.swift "${discover_args[@]}")
          discover_status=$?
          set -e

          jq -r '.notes[]?' <<< "$discovery_json" | while IFS= read -r note; do
            echo "Note: $note"
          done

          reviewer_harness=$(jq -r '.reviewerHarness // ""' <<< "$discovery_json")
          author_harness=$(jq -r '.authorHarness // ""' <<< "$discovery_json")

          if [[ $discover_status -ne 0 ]]; then
            reason=$(jq -r '.error // "Worktree discovery failed."' <<< "$discovery_json")
            {
              echo "discover_failed=true"
              echo "action=$action"
              echo "pr_number=$pr_number"
              echo "pr_branch=$pr_branch"
              echo "pr_head_sha=$pr_head_sha"
              echo "run_review=false"
              echo "run_address=false"
              echo "reviewer_harness=$reviewer_harness"
              echo "author_harness=$author_harness"
              echo "dry_run=$dry_run"
              echo "trigger_event=$EVENT_NAME"
              echo "comment_id=$COMMENT_ID"
            } >> "$GITHUB_OUTPUT"
            write_multiline_output "discover_error" "$reason"
            exit 0
          fi

          worktree_path=$(jq -r '.worktreePath // ""' <<< "$discovery_json")
          {
            echo "discover_failed=false"
            echo "action=$action"
            echo "pr_number=$pr_number"
            echo "pr_branch=$pr_branch"
            echo "pr_head_sha=$pr_head_sha"
            echo "run_review=$([[ "$action" == "review" ]] && echo true || echo false)"
            echo "run_address=true"
            echo "reviewer_override=$reviewer_override"
            echo "reviewer_harness=$reviewer_harness"
            echo "author_harness=$author_harness"
            echo "worktree_path=$worktree_path"
            echo "dry_run=$dry_run"
            echo "trigger_event=$EVENT_NAME"
            echo "comment_id=$COMMENT_ID"
          } >> "$GITHUB_OUTPUT"

          echo "Planned PR #$pr_number ($action): reviewer=${reviewer_harness:-none}, author=$author_harness, worktree=$worktree_path, dry_run=$dry_run"

      - name: Create Codex App token
        id: codex-token
        if: (steps.resolve.outputs.run_address == 'true' || steps.resolve.outputs.discover_failed == 'true') && steps.resolve.outputs.dry_run != 'true' && (steps.resolve.outputs.reviewer_harness == 'codex' || steps.resolve.outputs.author_harness == 'codex')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_CODEX_APP_ID || secrets.CLINICAL_CODEX_APP_ID }}
          private-key: ${{ secrets.CLINICAL_CODEX_PRIVATE_KEY }}

      - name: Create Antigravity App token
        id: agy-token
        if: (steps.resolve.outputs.run_address == 'true' || steps.resolve.outputs.discover_failed == 'true') && steps.resolve.outputs.dry_run != 'true' && (steps.resolve.outputs.reviewer_harness == 'antigravity' || steps.resolve.outputs.author_harness == 'antigravity')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_ANTIGRAVITY_APP_ID || secrets.CLINICAL_ANTIGRAVITY_APP_ID }}
          private-key: ${{ secrets.CLINICAL_ANTIGRAVITY_PRIVATE_KEY }}

      - name: Create queued checks and monitor records
        id: create-checks
        if: steps.resolve.outputs.run_address == 'true' || steps.resolve.outputs.discover_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TOKEN: ${{ steps.codex-token.outputs.token }}
          AGY_TOKEN: ${{ steps.agy-token.outputs.token }}
          DISCOVER_FAILED: ${{ steps.resolve.outputs.discover_failed }}
          DISCOVER_ERROR: ${{ steps.resolve.outputs.discover_error }}
          ACTION: ${{ steps.resolve.outputs.action }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_BRANCH: ${{ steps.resolve.outputs.pr_branch }}
          PR_HEAD_SHA: ${{ steps.resolve.outputs.pr_head_sha }}
          REVIEWER_HARNESS: ${{ steps.resolve.outputs.reviewer_harness }}
          AUTHOR_HARNESS: ${{ steps.resolve.outputs.author_harness }}
          DRY_RUN: ${{ steps.resolve.outputs.dry_run }}
          TRIGGER_EVENT: ${{ steps.resolve.outputs.trigger_event }}
          COMMENT_ID: ${{ steps.resolve.outputs.comment_id }}
        run: |
          set -euo pipefail
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          token_for_harness() {
            case "$1" in
              codex) printf '%s' "$CODEX_TOKEN" ;;
              antigravity) printf '%s' "$AGY_TOKEN" ;;
              *) printf '%s' "$GH_TOKEN" ;;
            esac
          }
          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ "$ACTION" == "review" ]]; then
              react_harness="$REVIEWER_HARNESS"
            else
              react_harness="$AUTHOR_HARNESS"
            fi
            react_token=$(token_for_harness "$react_harness")
            # Prefer reacting as the starting bot App; fall back to github.token if the App lacks Issues write.
            if ! GH_TOKEN="$react_token" swift scripts/agent_review_loop.swift react \
              --repo "$GITHUB_REPOSITORY" \
              --event "$TRIGGER_EVENT" \
              --comment-id "$COMMENT_ID" \
              --content eyes >/dev/null 2>&1; then
              swift scripts/agent_review_loop.swift react \
                --repo "$GITHUB_REPOSITORY" \
                --event "$TRIGGER_EVENT" \
                --comment-id "$COMMENT_ID" \
                --content eyes >/dev/null || true
            fi
          fi
          create_check_run() {
            local harness="$1" name="$2" status="$3" title="$4" summary="$5" conclusion="${6:-}"
            local token
            token=$(token_for_harness "$harness")
            local args=(
              swift scripts/agent_review_loop.swift check-run
              --repo "$GITHUB_REPOSITORY"
              --name "$name"
              --head-sha "$PR_HEAD_SHA"
              --status "$status"
              --title "$title"
              --summary "$summary"
              --details-url "$run_url"
              --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$name"
            )
            if [[ -n "$conclusion" ]]; then
              args+=(--conclusion "$conclusion")
            fi
            # Use the bot App token so GitHub creates a dedicated check suite per bot.
            GH_TOKEN="$token" "${args[@]}" || true
          }

          if [[ "$DISCOVER_FAILED" == "true" ]]; then
            echo "Discovery failed: $DISCOVER_ERROR" >&2
            if [[ "$DRY_RUN" != "true" ]]; then
              if [[ "$ACTION" == "review" ]]; then
                failed_harness="$REVIEWER_HARNESS"
              else
                failed_harness="$AUTHOR_HARNESS"
              fi
              create_check_run "$failed_harness" "$ACTION" "completed" "Stopped" "$DISCOVER_ERROR" "failure" >/dev/null
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Agent review loop stopped: $DISCOVER_ERROR"
            fi
            exit 1
          fi

          review_check_run_id=""
          address_check_run_id=""
          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ "$ACTION" == "review" ]]; then
              review_check_run_id=$(create_check_run "$REVIEWER_HARNESS" "review" "queued" "Queued ($REVIEWER_HARNESS)" "Waiting for clinical-agents runner to review PR #$PR_NUMBER.")
              address_check_run_id=$(create_check_run "$AUTHOR_HARNESS" "address" "queued" "Waiting for review ($AUTHOR_HARNESS)" "Will address review comments after review completes.")
              swift scripts/agent_review_loop.swift monitor-record \
                --run-id "$GITHUB_RUN_ID" \
                --kind "review-loop" \
                --phase review \
                --pr-number "$PR_NUMBER" \
                --pr-branch "$PR_BRANCH" \
                --head-sha "$PR_HEAD_SHA" \
                --repo "$GITHUB_REPOSITORY" \
                --run-url "$run_url" \
                --harness "$REVIEWER_HARNESS" \
                --status queued >/dev/null || true
              swift scripts/agent_review_loop.swift monitor-record \
                --run-id "$GITHUB_RUN_ID" \
                --kind "review-loop" \
                --phase address \
                --pr-number "$PR_NUMBER" \
                --pr-branch "$PR_BRANCH" \
                --head-sha "$PR_HEAD_SHA" \
                --repo "$GITHUB_REPOSITORY" \
                --run-url "$run_url" \
                --harness "$AUTHOR_HARNESS" \
                --status queued >/dev/null || true
            else
              address_check_run_id=$(create_check_run "$AUTHOR_HARNESS" "address" "queued" "Queued ($AUTHOR_HARNESS)" "Waiting for clinical-agents runner to address PR #$PR_NUMBER.")
              swift scripts/agent_review_loop.swift monitor-record \
                --run-id "$GITHUB_RUN_ID" \
                --kind "review-loop" \
                --phase address \
                --pr-number "$PR_NUMBER" \
                --pr-branch "$PR_BRANCH" \
                --head-sha "$PR_HEAD_SHA" \
                --repo "$GITHUB_REPOSITORY" \
                --run-url "$run_url" \
                --harness "$AUTHOR_HARNESS" \
                --status queued >/dev/null || true
            fi
          fi

          {
            echo "review_check_run_id=$review_check_run_id"
            echo "address_check_run_id=$address_check_run_id"
          } >> "$GITHUB_OUTPUT"

  review:
    name: Review PR
    needs: plan
    if: needs.plan.outputs.run_review == 'true'
    runs-on: clinical-agents
    timeout-minutes: 30
    outputs:
      pr_head_sha: ${{ steps.sync-head.outputs.pr_head_sha }}
      address_check_run_id: ${{ steps.sync-head.outputs.address_check_run_id }}
    steps:
      - name: Add Homebrew tools to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Create Codex App token
        id: codex-token
        if: needs.plan.outputs.dry_run != 'true' && (needs.plan.outputs.reviewer_harness == 'codex' || needs.plan.outputs.author_harness == 'codex')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_CODEX_APP_ID || secrets.CLINICAL_CODEX_APP_ID }}
          private-key: ${{ secrets.CLINICAL_CODEX_PRIVATE_KEY }}

      - name: Create Antigravity App token
        id: agy-token
        if: needs.plan.outputs.dry_run != 'true' && (needs.plan.outputs.reviewer_harness == 'antigravity' || needs.plan.outputs.author_harness == 'antigravity')
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_ANTIGRAVITY_APP_ID || secrets.CLINICAL_ANTIGRAVITY_APP_ID }}
          private-key: ${{ secrets.CLINICAL_ANTIGRAVITY_PRIVATE_KEY }}

      - name: Sync PR head if worktree advanced
        id: sync-head
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TOKEN: ${{ steps.codex-token.outputs.token }}
          AGY_TOKEN: ${{ steps.agy-token.outputs.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_BRANCH: ${{ needs.plan.outputs.pr_branch }}
          PLANNED_HEAD_SHA: ${{ needs.plan.outputs.pr_head_sha }}
          REVIEWER_OVERRIDE: ${{ needs.plan.outputs.reviewer_override }}
          REVIEWER_HARNESS: ${{ needs.plan.outputs.reviewer_harness }}
          AUTHOR_HARNESS: ${{ needs.plan.outputs.author_harness }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          REVIEW_CHECK_RUN_ID: ${{ needs.plan.outputs.review_check_run_id }}
          ADDRESS_CHECK_RUN_ID: ${{ needs.plan.outputs.address_check_run_id }}
        run: |
          set -euo pipefail
          token_for_harness() {
            case "$1" in
              codex) printf '%s' "$CODEX_TOKEN" ;;
              antigravity) printf '%s' "$AGY_TOKEN" ;;
              *) printf '%s' "$GH_TOKEN" ;;
            esac
          }
          reviewer_token=$(token_for_harness "$REVIEWER_HARNESS")
          author_token=$(token_for_harness "$AUTHOR_HARNESS")

          pr_head_sha="$PLANNED_HEAD_SHA"
          review_check_run_id="$REVIEW_CHECK_RUN_ID"
          address_check_run_id="$ADDRESS_CHECK_RUN_ID"

          live_head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')

          if [[ -n "$live_head_sha" && "$live_head_sha" != "$pr_head_sha" ]]; then
            script="$GITHUB_WORKSPACE/main/scripts/agent_review_loop.swift"
            discover_args=(
              discover
              --repo "$CANONICAL_REPO_PATH"
              --branch "$PR_BRANCH"
              --head-sha "$live_head_sha"
              --action review
              --super-db "$SUPER_ENGINEERING_DB"
              --require-clean
            )
            if [[ -n "$REVIEWER_OVERRIDE" ]]; then
              discover_args+=(--reviewer "$REVIEWER_OVERRIDE")
            fi

            set +e
            swift "$script" "${discover_args[@]}" >/dev/null
            discover_status=$?
            set -e

            if [[ $discover_status -eq 0 ]]; then
              echo "Advancing target PR head from $pr_head_sha to $live_head_sha."
              pr_head_sha="$live_head_sha"
              if [[ "$DRY_RUN" != "true" ]]; then
                swift "$script" monitor-record \
                  --run-id "$GITHUB_RUN_ID" \
                  --head-sha "$live_head_sha" >/dev/null || true
                run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                if [[ -n "$review_check_run_id" ]]; then
                  GH_TOKEN="$reviewer_token" swift "$script" check-run \
                    --repo "$GITHUB_REPOSITORY" \
                    --check-run-id "$review_check_run_id" \
                    --status completed \
                    --conclusion skipped \
                    --title "Superseded ($REVIEWER_HARNESS)" \
                    --summary "Superseded by newer commit $live_head_sha before review started." \
                    --details-url "$run_url" >/dev/null || true
                fi
                if [[ -n "$address_check_run_id" ]]; then
                  GH_TOKEN="$author_token" swift "$script" check-run \
                    --repo "$GITHUB_REPOSITORY" \
                    --check-run-id "$address_check_run_id" \
                    --status completed \
                    --conclusion skipped \
                    --title "Superseded ($AUTHOR_HARNESS)" \
                    --summary "Superseded by newer commit $live_head_sha before review started." \
                    --details-url "$run_url" >/dev/null || true
                fi
                review_check_run_id=$(GH_TOKEN="$reviewer_token" swift "$script" check-run \
                  --repo "$GITHUB_REPOSITORY" \
                  --name "review" \
                  --head-sha "$live_head_sha" \
                  --status queued \
                  --title "Queued ($REVIEWER_HARNESS)" \
                  --summary "Waiting for clinical-agents runner to review PR #$PR_NUMBER." \
                  --details-url "$run_url" \
                  --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-review" || true)
                address_check_run_id=$(GH_TOKEN="$author_token" swift "$script" check-run \
                  --repo "$GITHUB_REPOSITORY" \
                  --name "address" \
                  --head-sha "$live_head_sha" \
                  --status queued \
                  --title "Waiting for review ($AUTHOR_HARNESS)" \
                  --summary "Will address review comments after review completes." \
                  --details-url "$run_url" \
                  --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-address" || true)
              fi
            fi
          fi

          {
            echo "pr_head_sha=$pr_head_sha"
            echo "review_check_run_id=$review_check_run_id"
            echo "address_check_run_id=$address_check_run_id"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.sync-head.outputs.pr_head_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Mark review check in progress
        id: mark-in-progress
        if: needs.plan.outputs.dry_run != 'true' && steps.sync-head.outputs.review_check_run_id != ''
        env:
          CODEX_TOKEN: ${{ steps.codex-token.outputs.token }}
          AGY_TOKEN: ${{ steps.agy-token.outputs.token }}
          CHECK_RUN_ID: ${{ steps.sync-head.outputs.review_check_run_id }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_HEAD_SHA: ${{ steps.sync-head.outputs.pr_head_sha }}
          REVIEWER_HARNESS: ${{ needs.plan.outputs.reviewer_harness }}
        run: |
          if [[ "$REVIEWER_HARNESS" == "codex" ]]; then
            reviewer_token="$CODEX_TOKEN"
          else
            reviewer_token="$AGY_TOKEN"
          fi
          effective_id=$(GH_TOKEN="$reviewer_token" swift "$GITHUB_WORKSPACE/main/scripts/agent_review_loop.swift" check-run \
            --repo "$GITHUB_REPOSITORY" \
            --check-run-id "$CHECK_RUN_ID" \
            --name "review" \
            --head-sha "$PR_HEAD_SHA" \
            --status in_progress \
            --recreate-if-completed \
            --title "Reviewing PR ($REVIEWER_HARNESS)" \
            --summary "Running $REVIEWER_HARNESS on PR #$PR_NUMBER." \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-review" || true)
          echo "check_run_id=${effective_id:-$CHECK_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Run reviewer agent
        env:
          GH_TOKEN: ${{ needs.plan.outputs.reviewer_harness == 'codex' && steps.codex-token.outputs.token || (needs.plan.outputs.reviewer_harness == 'antigravity' && steps.agy-token.outputs.token || '') }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          REVIEWER_HARNESS: ${{ needs.plan.outputs.reviewer_harness }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          main_dir="$GITHUB_WORKSPACE/main"
          pr_dir=$(cd "$GITHUB_WORKSPACE/pr" && pwd -P)
          if [[ "$REVIEWER_HARNESS" == "codex" ]]; then
            bot_login="clinical-codex[bot]"
          else
            bot_login="clinical-antigravity[bot]"
          fi

          prompt="Review PR #$PR_NUMBER in $GITHUB_REPOSITORY using the my-review skill. You are running in a clean checkout of the PR head (do not modify files). Your assigned GitHub App identity is $bot_login."

          if [[ "$REVIEWER_HARNESS" == "codex" ]]; then
            skills_config=$(swift "$main_dir/scripts/agent_review_loop.swift" codex-skills-config \
              --repo "$pr_dir" --allow my-review,my-design-review)
            cmd=(
              codex exec --ignore-user-config --dangerously-bypass-hook-trust --json
              -C "$pr_dir"
              -c "projects={\"$pr_dir\"={trust_level=\"trusted\"}}"
              -m "$CODEX_REVIEWER_MODEL"
              -c "model_reasoning_effort=$CODEX_REVIEWER_EFFORT"
              -c 'sandbox_mode="danger-full-access"'
              -c 'web_search="live"'
              --disable apps --disable plugins
              --disable browser_use --disable browser_use_external --disable browser_use_full_cdp_access
              --disable computer_use --disable in_app_browser --disable image_generation
              -c "skills.config=$skills_config"
              "$prompt"
            )
          else
            cmd=(
              agy --model "$AGY_REVIEWER_MODEL" --effort "$AGY_REVIEWER_EFFORT"
              --output-format stream-json -p "$prompt"
            )
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "=== DRY RUN: review ==="
            echo "Harness:  $REVIEWER_HARNESS ($bot_login)"
            echo "Checkout: $pr_dir"
            echo "Prompt:   $prompt"
            printf 'Command:  '
            printf '%q ' "${cmd[@]}"
            echo
            exit 0
          fi

          if [[ "$REVIEWER_HARNESS" == "codex" ]]; then
            reviewer_model="$CODEX_REVIEWER_MODEL"
            reviewer_effort="$CODEX_REVIEWER_EFFORT"
          else
            reviewer_model="$AGY_REVIEWER_MODEL"
            reviewer_effort="$AGY_REVIEWER_EFFORT"
          fi
          stream_file="$AGENT_MONITOR_DIR/runs/$GITHUB_RUN_ID/review.jsonl"
          mkdir -p "$(dirname "$stream_file")"
          swift "$main_dir/scripts/agent_review_loop.swift" monitor-record \
            --run-id "$GITHUB_RUN_ID" \
            --phase review \
            --harness "$REVIEWER_HARNESS" \
            --bot-login "$bot_login" \
            --model "$reviewer_model" \
            --effort "$reviewer_effort" \
            --worktree "$pr_dir" \
            --prompt "$prompt" \
            --stream-file "$stream_file" \
            --status running >/dev/null || true

          cd "$pr_dir"
          "${cmd[@]}" 2>&1 | tee "$stream_file"

      - name: Complete review check
        if: always() && needs.plan.outputs.dry_run != 'true' && (steps.mark-in-progress.outputs.check_run_id || steps.sync-head.outputs.review_check_run_id) != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CODEX_TOKEN: ${{ steps.codex-token.outputs.token }}
          AGY_TOKEN: ${{ steps.agy-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          REVIEW_CHECK_RUN_ID: ${{ steps.mark-in-progress.outputs.check_run_id || steps.sync-head.outputs.review_check_run_id }}
          ADDRESS_CHECK_RUN_ID: ${{ steps.sync-head.outputs.address_check_run_id }}
          REVIEWER_HARNESS: ${{ needs.plan.outputs.reviewer_harness }}
          AUTHOR_HARNESS: ${{ needs.plan.outputs.author_harness }}
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          script="$GITHUB_WORKSPACE/main/scripts/agent_review_loop.swift"
          token_for_harness() {
            case "$1" in
              codex) printf '%s' "$CODEX_TOKEN" ;;
              antigravity) printf '%s' "$AGY_TOKEN" ;;
              *) printf '%s' "$GH_TOKEN" ;;
            esac
          }
          reviewer_token=$(token_for_harness "$REVIEWER_HARNESS")
          author_token=$(token_for_harness "$AUTHOR_HARNESS")

          case "$JOB_STATUS" in
            success) conclusion="success"; title="Review complete ($REVIEWER_HARNESS)" ;;
            cancelled) conclusion="cancelled"; title="Review cancelled ($REVIEWER_HARNESS)" ;;
            *) conclusion="failure"; title="Review failed ($REVIEWER_HARNESS)" ;;
          esac

          GH_TOKEN="$reviewer_token" swift "$script" check-run \
            --repo "$GITHUB_REPOSITORY" \
            --check-run-id "$REVIEW_CHECK_RUN_ID" \
            --status completed \
            --conclusion "$conclusion" \
            --title "$title" \
            --summary "Reviewer $REVIEWER_HARNESS finished with status $JOB_STATUS on PR #$PR_NUMBER." \
            --details-url "$run_url" >/dev/null || true

          swift "$script" monitor-record \
            --run-id "$GITHUB_RUN_ID" \
            --phase review \
            --status completed \
            --conclusion "$conclusion" >/dev/null || true

          if [[ "$JOB_STATUS" != "success" && -n "$ADDRESS_CHECK_RUN_ID" ]]; then
            GH_TOKEN="$author_token" swift "$script" check-run \
              --repo "$GITHUB_REPOSITORY" \
              --check-run-id "$ADDRESS_CHECK_RUN_ID" \
              --status completed \
              --conclusion skipped \
              --title "Address skipped ($AUTHOR_HARNESS)" \
              --summary "Skipped because the review job ended with status $JOB_STATUS." \
              --details-url "$run_url" >/dev/null || true
            swift "$script" monitor-record \
              --run-id "$GITHUB_RUN_ID" \
              --phase address \
              --status completed \
              --conclusion skipped >/dev/null || true
          fi

  address:
    name: Address review comments
    needs: [plan, review]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.run_address == 'true' &&
      (needs.plan.outputs.run_review != 'true' || needs.review.result == 'success')
    runs-on: clinical-agents
    timeout-minutes: 45
    steps:
      - name: Add Homebrew tools to PATH
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Create Codex author App token
        id: codex-token
        if: needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.author_harness == 'codex'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_CODEX_APP_ID || secrets.CLINICAL_CODEX_APP_ID }}
          private-key: ${{ secrets.CLINICAL_CODEX_PRIVATE_KEY }}

      - name: Create Antigravity author App token
        id: agy-token
        if: needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.author_harness == 'antigravity'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.CLINICAL_ANTIGRAVITY_APP_ID || secrets.CLINICAL_ANTIGRAVITY_APP_ID }}
          private-key: ${{ secrets.CLINICAL_ANTIGRAVITY_PRIVATE_KEY }}

      - name: Verify original worktree is clean and at PR head
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR_TOKEN: ${{ steps.codex-token.outputs.token || steps.agy-token.outputs.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_BRANCH: ${{ needs.plan.outputs.pr_branch }}
          PR_HEAD_SHA: ${{ needs.review.outputs.pr_head_sha || needs.plan.outputs.pr_head_sha }}
          REVIEWER_OVERRIDE: ${{ needs.plan.outputs.reviewer_override }}
          AUTHOR_HARNESS: ${{ needs.plan.outputs.author_harness }}
          CHECK_RUN_ID: ${{ needs.review.outputs.address_check_run_id || needs.plan.outputs.address_check_run_id }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          live_head_sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --json headRefOid --jq '.headRefOid')

          if [[ -n "$live_head_sha" && "$live_head_sha" != "$PR_HEAD_SHA" ]]; then
            reason="New commits were pushed during review; skipping address on stale review."
            echo "$reason ($PR_HEAD_SHA -> $live_head_sha)"
            if [[ "$DRY_RUN" != "true" ]]; then
              run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              script="$GITHUB_WORKSPACE/scripts/agent_review_loop.swift"
              if [[ -n "$CHECK_RUN_ID" ]]; then
                GH_TOKEN="$AUTHOR_TOKEN" swift "$script" check-run \
                  --repo "$GITHUB_REPOSITORY" \
                  --check-run-id "$CHECK_RUN_ID" \
                  --status completed \
                  --conclusion skipped \
                  --title "Address skipped ($AUTHOR_HARNESS)" \
                  --summary "$reason" \
                  --details-url "$run_url" >/dev/null || true
              fi
              GH_TOKEN="$AUTHOR_TOKEN" swift "$script" check-run \
                --repo "$GITHUB_REPOSITORY" \
                --name "address" \
                --head-sha "$live_head_sha" \
                --status completed \
                --conclusion skipped \
                --title "Address skipped ($AUTHOR_HARNESS)" \
                --summary "$reason" \
                --details-url "$run_url" \
                --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-address-stale" >/dev/null || true
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Agent address job stopped: $reason"
              swift "$script" monitor-record \
                --run-id "$GITHUB_RUN_ID" \
                --phase address \
                --status completed \
                --conclusion skipped >/dev/null || true
            fi
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          discover_args=(
            discover
            --repo "$CANONICAL_REPO_PATH"
            --branch "$PR_BRANCH"
            --head-sha "$PR_HEAD_SHA"
            --action address
            --super-db "$SUPER_ENGINEERING_DB"
            --require-clean
          )
          if [[ -n "$REVIEWER_OVERRIDE" ]]; then
            discover_args+=(--reviewer "$REVIEWER_OVERRIDE")
          fi

          set +e
          discovery_json=$(swift scripts/agent_review_loop.swift "${discover_args[@]}")
          status=$?
          set -e

          if [[ $status -ne 0 ]]; then
            reason=$(jq -r '.error // "Worktree safety check failed."' <<< "$discovery_json")
            echo "Worktree safety check failed: $reason" >&2
            if [[ "$DRY_RUN" != "true" ]]; then
              gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
                --body "Agent address job stopped: $reason"
            fi
            exit 1
          fi

          worktree_path=$(jq -r '.worktreePath' <<< "$discovery_json")
          author_harness=$(jq -r '.authorHarness' <<< "$discovery_json")
          {
            echo "skipped=false"
            echo "worktree_path=$worktree_path"
            echo "author_harness=$author_harness"
            echo "address_check_run_id=$CHECK_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Mark address check in progress
        id: mark-in-progress
        if: steps.verify.outputs.skipped != 'true' && needs.plan.outputs.dry_run != 'true' && steps.verify.outputs.address_check_run_id != ''
        env:
          GH_TOKEN: ${{ steps.codex-token.outputs.token || steps.agy-token.outputs.token }}
          CHECK_RUN_ID: ${{ steps.verify.outputs.address_check_run_id }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.review.outputs.pr_head_sha || needs.plan.outputs.pr_head_sha }}
          AUTHOR_HARNESS: ${{ needs.plan.outputs.author_harness }}
        run: |
          effective_id=$(swift "$GITHUB_WORKSPACE/scripts/agent_review_loop.swift" check-run \
            --repo "$GITHUB_REPOSITORY" \
            --check-run-id "$CHECK_RUN_ID" \
            --name "address" \
            --head-sha "$PR_HEAD_SHA" \
            --status in_progress \
            --recreate-if-completed \
            --title "Addressing review comments ($AUTHOR_HARNESS)" \
            --summary "Verifying worktree and running $AUTHOR_HARNESS on PR #$PR_NUMBER." \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --external-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-address" || true)
          echo "check_run_id=${effective_id:-$CHECK_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Run author agent
        if: steps.verify.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ steps.codex-token.outputs.token || steps.agy-token.outputs.token }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          WORKTREE_PATH: ${{ steps.verify.outputs.worktree_path }}
          AUTHOR_HARNESS: ${{ steps.verify.outputs.author_harness }}
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
        run: |
          set -euo pipefail
          main_dir="$GITHUB_WORKSPACE"
          worktree_dir=$(cd "$WORKTREE_PATH" && pwd -P)
          if [[ "$AUTHOR_HARNESS" == "codex" ]]; then
            bot_login="clinical-codex[bot]"
          else
            bot_login="clinical-antigravity[bot]"
          fi

          prompt="Address review comments on PR #$PR_NUMBER in $GITHUB_REPOSITORY using the my-address-review skill. Your assigned GitHub App identity is $bot_login."

          if [[ "$AUTHOR_HARNESS" == "codex" ]]; then
            skills_config=$(swift "$main_dir/scripts/agent_review_loop.swift" codex-skills-config \
              --repo "$worktree_dir" --allow my-address-review,my-design-review)
            cmd=(
              codex exec --ignore-user-config --dangerously-bypass-hook-trust --json
              -C "$worktree_dir"
              -c "projects={\"$worktree_dir\"={trust_level=\"trusted\"}}"
              -m "$CODEX_AUTHOR_MODEL"
              -c "model_reasoning_effort=$CODEX_AUTHOR_EFFORT"
              -c 'sandbox_mode="danger-full-access"'
              -c 'web_search="live"'
              --disable apps
              --disable browser_use --disable browser_use_external --disable browser_use_full_cdp_access
              --disable computer_use --disable in_app_browser --disable image_generation
              -c plugins.build-ios-apps@openai-curated-remote.enabled=true
              -c "skills.config=$skills_config"
              "$prompt"
            )
          else
            cmd=(
              agy --model "$AGY_AUTHOR_MODEL" --effort "$AGY_AUTHOR_EFFORT"
              --output-format stream-json -p "$prompt"
            )
          fi

          if [[ "$DRY_RUN" == "true" ]]; then
            echo "=== DRY RUN: address ==="
            echo "Harness:  $AUTHOR_HARNESS ($bot_login)"
            echo "Worktree: $worktree_dir"
            echo "Prompt:   $prompt"
            printf 'Command:  '
            printf '%q ' "${cmd[@]}"
            echo
            exit 0
          fi

          if [[ "$AUTHOR_HARNESS" == "codex" ]]; then
            author_model="$CODEX_AUTHOR_MODEL"
            author_effort="$CODEX_AUTHOR_EFFORT"
          else
            author_model="$AGY_AUTHOR_MODEL"
            author_effort="$AGY_AUTHOR_EFFORT"
          fi
          stream_file="$AGENT_MONITOR_DIR/runs/$GITHUB_RUN_ID/address.jsonl"
          mkdir -p "$(dirname "$stream_file")"
          swift "$main_dir/scripts/agent_review_loop.swift" monitor-record \
            --run-id "$GITHUB_RUN_ID" \
            --phase address \
            --harness "$AUTHOR_HARNESS" \
            --bot-login "$bot_login" \
            --model "$author_model" \
            --effort "$author_effort" \
            --worktree "$worktree_dir" \
            --prompt "$prompt" \
            --stream-file "$stream_file" \
            --status running >/dev/null || true

          cd "$worktree_dir"
          "${cmd[@]}" 2>&1 | tee "$stream_file"

      - name: Complete address check
        if: always() && steps.verify.outputs.skipped != 'true' && needs.plan.outputs.dry_run != 'true' && (steps.mark-in-progress.outputs.check_run_id || steps.verify.outputs.address_check_run_id || needs.review.outputs.address_check_run_id || needs.plan.outputs.address_check_run_id) != ''
        env:
          GH_TOKEN: ${{ steps.codex-token.outputs.token || steps.agy-token.outputs.token }}
          JOB_STATUS: ${{ job.status }}
          PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
          CHECK_RUN_ID: ${{ steps.mark-in-progress.outputs.check_run_id || steps.verify.outputs.address_check_run_id || needs.review.outputs.address_check_run_id || needs.plan.outputs.address_check_run_id }}
          AUTHOR_HARNESS: ${{ needs.plan.outputs.author_harness }}
        run: |
          case "$JOB_STATUS" in
            success) conclusion="success"; title="Address complete ($AUTHOR_HARNESS)" ;;
            cancelled) conclusion="cancelled"; title="Address cancelled ($AUTHOR_HARNESS)" ;;
            *) conclusion="failure"; title="Address failed ($AUTHOR_HARNESS)" ;;
          esac

          swift "$GITHUB_WORKSPACE/scripts/agent_review_loop.swift" check-run \
            --repo "$GITHUB_REPOSITORY" \
            --check-run-id "$CHECK_RUN_ID" \
            --status completed \
            --conclusion "$conclusion" \
            --title "$title" \
            --summary "Author $AUTHOR_HARNESS finished with status $JOB_STATUS on PR #$PR_NUMBER." \
            --details-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null || true

          swift "$GITHUB_WORKSPACE/scripts/agent_review_loop.swift" monitor-record \
            --run-id "$GITHUB_RUN_ID" \
            --phase address \
            --status completed \
            --conclusion "$conclusion" >/dev/null || true
